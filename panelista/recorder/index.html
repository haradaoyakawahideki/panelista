<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;font-family:"Source Sans Pro",system-ui,sans-serif;color:#31333F}
  .box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 2px}
  button{font:inherit;font-size:16px;padding:10px 18px;border-radius:8px;border:1px solid #003A70;cursor:pointer}
  #go{background:#003A70;color:#fff} #go.rec{background:#C0392B;border-color:#C0392B}
  #clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:600;min-width:96px}
  #clock.protected{color:#7f8c8d} #clock.open{color:#1e8449} #clock.over{color:#C0392B}
  #msg{font-size:14px;color:#555}
</style></head><body>
<div class="box">
  <button id="go">● Grabar</button>
  <span id="clock">0:00</span>
  <span id="msg">Las campanas suenan solas. Se detiene a la hora límite.</span>
</div>
<script>
const send = (type, extra={}) => parent.postMessage({isStreamlitMessage:true, type, ...extra}, "*");
let args = {bells:[], limit:500, label:""}, ctx, rec, chunks=[], t0, tick, rung, stream;

window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") args = e.data.args;
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:70});

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

function bell(n){                       // n strikes, synthesized (no audio files)
  for (let i=0;i<n;i++){
    const t = ctx.currentTime + i*0.45;
    [880, 2210].forEach((f,k)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(k?0.15:0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t+1.2);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+1.3);
    });
  }
}

async function start(){
  ctx = ctx || new AudioContext(); await ctx.resume();
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ document.getElementById("msg").textContent = "No hay permiso para usar el micrófono."; return; }
  const mime = ["audio/webm","audio/mp4","audio/ogg"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
  chunks = []; rung = new Set();
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = finish;
  rec.start(1000); t0 = performance.now();
  go.textContent = "■ Detener"; go.classList.add("rec");
  tick = setInterval(update, 200);
}

function update(){
  const s = (performance.now()-t0)/1000, c = document.getElementById("clock");
  c.textContent = fmt(s);
  const over = args.bells[args.bells.length-2][0];          // the double bell = time is up
  const pois = args.bells.length > 2;                         // constructives: 1:00–7:00 open to POIs
  c.className = s >= over ? "over" : pois && s >= args.bells[0][0] && s < args.bells[1][0] ? "open" : "protected";
  for (const [at, n] of args.bells) if (s >= at && !rung.has(at)) { rung.add(at); bell(n); }
  if (s >= args.limit) stop("Tiempo máximo alcanzado: grabación detenida.");
}

function stop(note){
  clearInterval(tick);
  if (rec && rec.state !== "inactive") rec.stop();
  stream && stream.getTracks().forEach(t => t.stop());
  go.textContent = "● Grabar"; go.classList.remove("rec");
  if (note) document.getElementById("msg").textContent = note;
}

function finish(){
  const secs = (performance.now()-t0)/1000;
  const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
  const r = new FileReader();
  r.onload = () => send("streamlit:setComponentValue", {dataType:"json",
      value:{id: Date.now(), mime: blob.type, secs, b64: r.result.split(",")[1]}});
  r.readAsDataURL(blob);
  document.getElementById("msg").textContent = `Grabado: ${fmt(secs)}. Guardando…`;
}

const go = document.getElementById("go");
go.onclick = () => (rec && rec.state === "recording") ? stop() : start();
</script></body></html>
